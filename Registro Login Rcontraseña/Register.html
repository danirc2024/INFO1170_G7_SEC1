<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="Register.css">
</head>
<body>
    <div class="register-container">
        <form action="Register.php" method="POST">
            <h2>Registro</h2>
            <div class="input-group">
                <label for="NombreUser">Nombre de Usuario:</label>
                <input type="text" id="NombreUser" name="NombreUser" required maxlength="80">
                
                <label for="Password">Contraseña:</label>
                <input type="password" id="Password" name="Password" required maxlength="100">
                
                <label for="Email">Correo Electrónico:</label>
                <input type="email" id="Email" name="Email" required maxlength="100">
                
                <label for="RolUser">Rol de Usuario:</label>
                <select id="RolUser" name="RolUser" required>
                    <option value="Usuario">Usuario</option>
                </select>
            </div>
            <div class="register-btn">
                <input type="submit" value="Registrarse" />
            </div>
            <a href="Login.html">¿Tienes cuenta?</a>
        </form>
    </div>
</body>
</html>
